name: Drain queue (heartbeat)

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron can be delayed during peak load,
    # but typically fires within a couple of minutes of the slot.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit /api/cron/heartbeat
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://www.mypadelleague.es' }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET secret is empty or missing in repo settings"
            exit 1
          fi
          echo "Secret length: ${#CRON_SECRET}"
          # Auth via ?key= query param: GitHub Actions <-> Vercel was stripping
          # the Authorization header somewhere in transit, so we use the query
          # param fallback the route accepts. The route does timing-safe
          # equality on this value just like with the header.
          status=$(curl --silent --show-error --location --max-time 90 \
                       --header "User-Agent: gha-padel-cron/1.0" \
                       -w "%{http_code}" \
                       -o response.body \
                       --get \
                       --data-urlencode "key=${CRON_SECRET}" \
                       "${APP_URL}/api/cron/heartbeat")
          echo "HTTP status: ${status}"
          echo "--- body ---"
          cat response.body || true
          echo
          if [ "${status}" != "200" ]; then
            echo "::error::Heartbeat returned ${status}"
            exit 1
          fi
